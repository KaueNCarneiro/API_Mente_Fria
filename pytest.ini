; Configuração da suíte de testes (Fase 6 — P6-01).
;
; `pythonpath = .` coloca a raiz do repositório no sys.path, de modo que `src.api` seja
; importável sem instalar o projeto nem depender de como o pytest foi invocado.
; As variáveis de ambiente de teste NÃO ficam aqui: `src/api/tests/conftest.py` as define
; antes de importar a aplicação, para que nenhum teste toque o banco de desenvolvimento.
[pytest]
testpaths = src/api/tests
pythonpath = .
addopts = -q --strict-markers --strict-config
markers =
    slow: teste demorado (executa um verificador completo em subprocesso)
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:fastapi.*
